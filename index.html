    <style>
        @keyframes burstStar {
            0% { transform: translate(0, 0) scale(0.2) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(720deg); opacity: 0; }
        }
        .burst-particle { position: absolute; top: 50%; left: 50%; animation: burstStar 2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; pointer-events: none; z-index: 60; }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.05); }
            35% { transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); }
        }
        .congrats-banner {
            animation: fadeInOut 3.5s ease-in-out forwards;
        }
    </style>
</head>
<body class="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen p-4 font-sans pb-20 relative overflow-x-hidden">

        function dispararExplosionEstrellas(cantidad = 200) {
            const overlay = document.getElementById('explosion-overlay');
            if (!overlay) return;
            overlay.innerHTML = '';
            overlay.classList.remove('hidden');
            
            const simbolos = ['⭐', '🌟', '✨', '💫', '✦'];
            for (let i = 0; i < cantidad; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle font-bold';
                particle.innerHTML = simbolos[Math.floor(Math.random() * simbolos.length)];
                particle.style.fontSize = `${Math.floor(Math.random() * 22) + 10}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 380;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                particle.style.setProperty('--scale', 0.6 + Math.random() * 2.2);
                
                overlay.appendChild(particle);
            }
        }

        // --- BIBLIOTECA ---
        async function cargarLibros() {
            currentView = 'books'; isApocryphaMode = false; backBtn.classList.add('hidden');
            mainTitle.innerText = "📖 Biblia TMA"; 
            mainSubtitle.innerText = subtituloPlataforma; 
            mainSubtitle.style.display = 'block';
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando contenido...</div>';
            try {
                const { data, error } = await supabaseClient.from('bible_books').select('*').order('id', { ascending: true });
                if (error) throw error;
                allBooksCache = data || [];
                renderizarSeccionBiblia('all');
            } catch (err) { contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar la biblioteca.</p>'; }
        }

        async function renderizarSeccionBiblia(filtro = 'all') {
            currentView = 'books';
            currentBibleFilter = filtro;
            backBtn.classList.add('hidden');
            mainTitle.innerText = "📖 Biblia TMA"; 
            mainSubtitle.innerText = subtituloPlataforma; 
            mainSubtitle.style.display = 'block';

            const dailyVerseHTML = await obtenerPalabraDelDiaHTML();
            
            const navCategoriasHTML = `
                <div class="grid grid-cols-2 gap-2 my-3">
                    <button onclick="renderizarSeccionBiblia('all')" class="p-2.5 rounded-xl font-bold text-xs transition ${filtro === 'all' ? 'bg-amber-600 text-white shadow-md' : 'bg-zinc-100 dark:bg-zinc-800 opacity-80'}">📖 Biblia completa</button>
                    <button onclick="renderizarSeccionBiblia('old')" class="p-2.5 rounded-xl font-bold text-xs transition ${filtro === 'old' ? 'bg-amber-600 text-white shadow-md' : 'bg-zinc-100 dark:bg-zinc-800 opacity-80'}">📜 Antiguo Testamento</button>
                    <button onclick="renderizarSeccionBiblia('new')" class="p-2.5 rounded-xl font-bold text-xs transition ${filtro === 'new' ? 'bg-amber-600 text-white shadow-md' : 'bg-zinc-100 dark:bg-zinc-800 opacity-80'}">✉️ Nuevo Testamento</button>
                    <button onclick="renderizarSeccionBiblia('gospels')" class="p-2.5 rounded-xl font-bold text-xs transition ${filtro === 'gospels' ? 'bg-amber-600 text-white shadow-md' : 'bg-zinc-100 dark:bg-zinc-800 opacity-80'}">✝️ Los Evangelios</button>
                </div>
            `;

            let librosFiltrados = allBooksCache;
            if (filtro === 'old') {
                librosFiltrados = allBooksCache.filter(b => {
                    const t = (b.testament || '').toLowerCase();
                    const name = (b.name || '').toLowerCase();
                    return t.includes('antiguo') || t.includes('at') || b.id <= 39 || name.includes('génesis') || (!t.includes('nuevo') && b.id <= 39);
                });
                if (librosFiltrados.length === 0) librosFiltrados = allBooksCache.filter(b => b.id <= 39);
            } else if (filtro === 'new') {
                librosFiltrados = allBooksCache.filter(b => {
                    const t = (b.testament || '').toLowerCase();
                    return t.includes('nuevo') || t.includes('nt') || b.id > 39;
                });
                if (librosFiltrados.length === 0) librosFiltrados = allBooksCache.filter(b => b.id > 39);
            } else if (filtro === 'gospels') {
                const evangeliosNombres = ['mateo', 'marcos', 'lucas', 'juan'];
                librosFiltrados = allBooksCache.filter(b => evangeliosNombres.some(ev => (b.name || '').toLowerCase().includes(ev)));
            }

            const librosHTML = librosFiltrados.map(book => `
                <div onclick="seleccionarLibro('${book.id}', '${book.name}')" class="flex items-center justify-between p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 active:scale-98 transition cursor-pointer shadow-sm">
                    <div><span class="font-semibold text-base">${book.name}</span><span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-700 opacity-80">${book.testament || ''}</span></div>
                    <span class="opacity-40 text-lg">›</span>
                </div>
            `).join('');

            contentBox.innerHTML = dailyVerseHTML + navCategoriasHTML + '<div class="space-y-2 mt-4">' + (librosHTML || '<p class="text-center opacity-60 py-6">No hay libros en esta categoría.</p>') + '</div>';
        }

        async function cargarApocrifos() {
            currentView = 'apocrypha_list'; isApocryphaMode = true; backBtn.classList.add('hidden');
            mainTitle.innerText = "📜 Textos Apócrifos e Históricos"; mainSubtitle.innerText = "Evangelios y escritos antiguos"; mainSubtitle.style.display = 'block';
            try {
                const { data, error } = await supabaseClient.from('apocrypha_books').select('*').order('id', { ascending: true });
                if (error) throw error;
                contentBox.innerHTML = '<div class="space-y-2">' + data.map(book => `
                    <div onclick="seleccionarLibro('${book.id}', '${book.name}')" class="flex items-center justify-between p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 active:scale-98 transition cursor-pointer shadow-sm">
                        <div><span class="font-semibold text-base">${book.name}</span><span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-600 dark:text-amber-400 font-medium">${book.testament || ''}</span></div>
                        <span class="opacity-40 text-lg">›</span>
                    </div>
                `).join('') + '</div>';
            } catch (err) { contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar apócrifos.</p>'; }
        }

        async function obtenerPalabraDelDiaHTML() {
            const todayStr = new Date().toISOString().split('T')[0];
            let dailyData = JSON.parse(localStorage.getItem('bible_daily_verse'));
            if (!dailyData || dailyData.date !== todayStr) {
                try {
                    const { data } = await supabaseClient.from('bible_verses').select('chapter, verse, text, bible_books(name, modern_name)').limit(100);
                    if (data && data.length > 0) {
                        const v = data[Math.floor(Math.random() * data.length)];
                        dailyData = { date: todayStr, book: v.bible_books?.modern_name || v.bible_books?.name || 'Escritura', chapter: v.chapter, verse: v.verse, text: v.text };
                        localStorage.setItem('bible_daily_verse', JSON.stringify(dailyData));
                    }
                } catch (e) {}
            }
            if (!dailyData) return '';
            return `
                <div class="p-4 rounded-2xl bg-gradient-to-br from-amber-500/15 via-amber-500/10 to-transparent border border-amber-500/40 shadow-md space-y-2 relative overflow-hidden">
                    <div class="flex items-center justify-between"><span class="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider">🌅 Palabra del Día</span></div>
                    <p class="text-sm italic opacity-90 font-serif leading-relaxed">"${dailyData.text}"</p>
                    <div class="flex justify-between items-center pt-1"><span class="text-xs font-extrabold text-amber-600 dark:text-amber-400">📖 ${dailyData.book} ${dailyData.chapter}:${dailyData.verse}</span></div>
                </div>
            `;
        }

        async function seleccionarLibro(bookId, bookName) {
            selectedBook = { id: bookId, name: bookName }; currentView = 'chapters'; backBtn.classList.remove('hidden');
            mainTitle.innerText = bookName; mainSubtitle.innerText = "Selecciona un capítulo";
            try {
                const tableName = isApocryphaMode ? 'apocrypha_verses' : 'bible_verses';
                const { data } = await supabaseClient.from(tableName).select('chapter').eq('book_id', bookId);
                const chapters = [...new Set(data.map(item => item.chapter))].sort((a, b) => a - b);
                contentBox.innerHTML = `<div class="grid grid-cols-4 gap-2">${chapters.map(chNum => `<div onclick="seleccionarCapitulo(${chNum})" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 text-center font-semibold active:scale-95 transition cursor-pointer shadow-sm">${chNum}</div>`).join('')}</div>`;
            } catch (err) {}
        }

        async function seleccionarCapitulo(chapterNumber) {
            currentView = 'verses'; backBtn.classList.remove('hidden'); mainTitle.innerText = `${selectedBook.name} - Cap. ${chapterNumber}`; mainSubtitle.style.display = 'none';
            try {
                const tableName = isApocryphaMode ? 'apocrypha_verses' : 'bible_verses';
                const { data } = await supabaseClient.from(tableName).select('*').eq('book_id', selectedBook.id).eq('chapter', chapterNumber).order('verse', { ascending: true });
                contentBox.innerHTML = data.map(v => `
                    <div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 leading-relaxed text-sm flex justify-between items-start gap-2">
                        <div><span class="font-bold text-xs opacity-60 mr-1">${v.verse}</span> ${v.text}</div>
                        <button onclick="toggleFavorito('${selectedBook.name.replace(/'/g, "\\'")}', ${chapterNumber}, ${v.verse}, '${v.text.replace(/'/g, "\\'")}')" class="text-amber-500 text-lg hover:scale-110 transition">⭐</button>
                    </div>
                `).join('');
            } catch (err) {}
        }

                titulo: "Cuan Grande Es Él",

            {

                tipo: "Alabanza",

        // --- BUSCADOR GENERALIZADO ROBUSTO ---
        async function ejecutarBusqueda() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('search-results');
            if (!rawQuery) return;
            resultsContainer.innerHTML = '<div class="text-center py-6 opacity-65">Buscando...</div>';
            try {
                const partes = rawQuery.split(' ');
                const soloTexto = partes.filter(p => isNaN(p)).join(' ').trim();
                const numeroCapitulo = partes.find(p => !isNaN(p) && p !== '');

                const { data: librosCoincidentes } = await supabaseClient
                    .from('bible_books')
                    .select('id')
                    .or(`name.ilike.%${soloTexto || rawQuery}%,modern_name.ilike.%${soloTexto || rawQuery}%`);

                const bookIds = librosCoincidentes ? librosCoincidentes.map(b => b.id) : [];

                let query = supabaseClient
                    .from('bible_verses')
                    .select('chapter, verse, text, book_id, bible_books(name, modern_name)');

                if (bookIds.length > 0 && numeroCapitulo) {
                    query = query.in('book_id', bookIds).eq('chapter', Number(numeroCapitulo));
                } else if (bookIds.length > 0) {
                    query = query.in('book_id', bookIds);
                } else {
                    query = query.ilike('text', `%${rawQuery}%`);
                }

                const { data, error } = await query.limit(40);

                if (error) throw error;
                if (!data || data.length === 0) { 
                    resultsContainer.innerHTML = `<p class="text-center opacity-60 py-5">No se encontraron resultados para "${rawQuery}".</p>`; 
                    return; 
                }

                resultsContainer.innerHTML = data.map(item => `
                    <div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 text-sm shadow-sm flex justify-between items-start">
                        <div>
                            <div class="font-bold text-amber-600 dark:text-amber-400 mb-1">${item.bible_books?.modern_name || item.bible_books?.name} ${item.chapter}:${item.verse}</div>
                            <div class="opacity-90">"${item.text}"</div>
                        </div>
                        <button onclick="toggleFavorito('${(item.bible_books?.modern_name || item.bible_books?.name).replace(/'/g, "\\'")}', ${item.chapter}, ${item.verse}, '${item.text.replace(/'/g, "\\'")}')" class="text-amber-500 text-lg ml-2">⭐</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = `<p class="text-center text-red-500 py-5">Error al realizar la búsqueda.</p>`;
            }
        }

        async function obtenerListaOraciones() {
            const listContainer = document.getElementById('prayer-list');
            try {
                const { data } = await supabaseClient.from('prayer_requests').select('*').order('created_at', { ascending: false }).limit(30);
                if (!data || data.length === 0) { listContainer.innerHTML = '<p class="text-center opacity-60 py-4">No hay peticiones aún.</p>'; return; }
                
                const peticionesReales = data.filter(p => {
                    const texto = (p.request_text || '').trim();
                    return !texto.startsWith('💡') && !texto.startsWith('🎵');
                });

                if (peticionesReales.length === 0) { listContainer.innerHTML = '<p class="text-center opacity-60 py-4">No hay peticiones de oración aún.</p>'; return; }

                listContainer.innerHTML = peticionesReales.map(p => `
                    <div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 text-sm flex justify-between items-start gap-2">
                        <p class="opacity-90 flex-1">${p.request_text}</p>
                        ${p.telegram_id == currentTelegramId ? `<button onclick="eliminarOracion(${p.id})" class="text-xs text-red-500 shrink-0">Borrar</button>` : ''}
                    </div>
                `).join('');
            } catch (err) {}
        }

        async function enviarOracion() {
            const text = document.getElementById('prayerInput').value.trim();
            if (!text) return;
            try {
                await supabaseClient.from('prayer_requests').insert([{ telegram_id: currentTelegramId, request_text: text, is_public: true }]);
                document.getElementById('prayerInput').value = '';
                alert("🙏 Petición compartida.");
                obtenerListaOraciones();
            } catch (err) {}
        }

        async function eliminarOracion(id) {
            try {
                await supabaseClient.from('prayer_requests').delete().eq('id', id).eq('telegram_id', currentTelegramId);
                obtenerListaOraciones();
            } catch (err) {}
        }

                    <h3 class="text-lg font-bold">¡Desafía tus conocimientos!</h3>
                    <p class="text-xs opacity-70">Responde correctamente a 5 preguntas aleatorias.</p>
                    <button onclick="iniciarPartidaTrivia()" class="w-full py-3.5 bg-amber-600 text-white rounded-xl font-bold text-sm shadow-md">🚀 Iniciar Partida de Trivia</button>
                </div>
                <div id="trivia-container" class="space-y-3 mt-4"></div>
            `;
        }

        let partidaActual = { preguntas: [], respondidas: 0, aciertos: 0 };

        async function iniciarPartidaTrivia() {
            const container = document.getElementById('trivia-container');
            document.getElementById('trivia-intro').style.display = 'none';
            container.innerHTML = '<div class="text-center py-6 opacity-65">Cargando 5 preguntas aleatorias...</div>';
            try {
                const { data } = await supabaseClient.from('trivia_questions').select('*');
                if (!data || data.length === 0) { container.innerHTML = `<div class="p-4 rounded-xl bg-zinc-100 text-center text-sm">No hay preguntas de trivia.</div>`; return; }
                partidaActual = { preguntas: data.sort(() => 0.5 - Math.random()).slice(0, 5), respondidas: 0, aciertos: 0 };
                renderizarPreguntasTrivia();
            } catch (err) {}
        }

        function renderizarPreguntasTrivia() {
            document.getElementById('trivia-container').innerHTML = partidaActual.preguntas.map((q, index) => `
                <div class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 space-y-3 shadow-sm question-card" data-correct="${(q.correct_option || 'A').toUpperCase().trim()}">
                    <div class="text-xs font-bold text-amber-500 uppercase">Pregunta ${index + 1} de 5</div>
                    <p class="font-semibold text-sm">${q.question_text || q.question}</p>
                    <div class="space-y-2 pt-1 options-group">
                        <div onclick="verificarRespuestaTrivia(this, 'A', ${q.points || 5})" data-option="A" class="option-btn p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-medium cursor-pointer">A) ${q.option_a}</div>
                        <div onclick="verificarRespuestaTrivia(this, 'B', ${q.points || 5})" data-option="B" class="option-btn p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-medium cursor-pointer">B) ${q.option_b}</div>
                        ${q.option_c ? `<div onclick="verificarRespuestaTrivia(this, 'C', ${q.points || 5})" data-option="C" class="option-btn p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-medium cursor-pointer">C) ${q.option_c}</div>` : ''}
                        ${q.option_d ? `<div onclick="verificarRespuestaTrivia(this, 'D', ${q.points || 5})" data-option="D" class="option-btn p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-medium cursor-pointer">D) ${q.option_d}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function verificarRespuestaTrivia(elemento, opcionSeleccionada, puntos) {
            const card = elemento.closest('.question-card');
            if (card.classList.contains('answered')) return;
            card.classList.add('answered');
            partidaActual.respondidas++;
            const opcionCorrecta = card.getAttribute('data-correct');
            const opciones = card.querySelectorAll('.option-btn');
            opciones.forEach(opt => opt.style.pointerEvents = 'none');

            if (opcionSeleccionada === opcionCorrecta) {
                elemento.classList.add('bg-green-500/20', 'border', 'border-green-500', 'text-green-600');
                userStats.stars += puntos; guardarStats();
                document.getElementById('global-stars-display').innerText = userStats.stars;
                partidaActual.aciertos++;
            } else {
                elemento.classList.add('bg-red-500/20', 'border', 'border-red-500', 'text-red-600');
                opciones.forEach(opt => { if (opt.getAttribute('data-option') === opcionCorrecta) opt.classList.add('bg-green-500/20', 'border', 'border-green-500', 'text-green-600', 'font-bold'); });
            }

            if (partidaActual.respondidas === partidaActual.preguntas.length) {
                setTimeout(() => {
                    if (partidaActual.aciertos === 5) {
                        mostrarFelicidadesDiosTeBendice();
                    } else {
                        alert(`🏁 ¡Partida finalizada! Acertaste ${partidaActual.aciertos} de 5.`);
                    }
                    setTimeout(() => { cargarTrivia(); }, partidaActual.aciertos === 5 ? 3500 : 400);
                }, 800);
            }
        }

        // --- BOTÓN VOLVER INTELIGENTE ---
        function volverAtras() {
            if (currentView === 'verses') seleccionarLibro(selectedBook.id, selectedBook.name);
            else if (currentView === 'chapters') renderizarSeccionBiblia(currentBibleFilter);
            else if (currentView === 'estampitas_names') cargarEstampitas();
            else if (currentView === 'estampitas_photos') cargarNombresEstampas(selectedCategory.id, selectedCategory.name);
            else if (currentView === 'prayer_categories') cargarOraciones();
            else if (currentView === 'prayer_detail') cargarMenuCategoriasOraciones();
            else if (currentView === 'rosary') cargarOraciones();
            else if (currentView === 'rosary_detail') cargarRosarioGuiado();
            else if (currentView === 'rosary_step') mostrarMisterioRosario(rosarioTipoSeleccionado);
            else if (currentView === 'plan_detail') cargarPlanes();
            else if (currentView === 'admin_panel') cargarLibros();
        }

        // Inicialización y verificación de admin al cargar
        cargarLibros();
        verificarAdminYMostrarMenu();
    </script>
</body>
</html>
