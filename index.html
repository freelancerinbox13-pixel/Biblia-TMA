<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblia TMA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen p-4 font-sans">

    <div class="max-w-md mx-auto">
        <!-- CABECERA ÚNICA -->
        <header class="mb-6 flex items-center justify-between">
            <button id="back-btn" onclick="volverAtras()" class="hidden px-3 py-1.5 rounded-lg bg-zinc-200 dark:bg-zinc-800 text-sm font-medium active:scale-95 transition">
                ← Volver
            </button>
            <div class="text-center flex-1">
                <h1 id="main-title" class="text-2xl font-bold">📖 Biblia TMA</h1>
                <p id="main-subtitle" class="text-sm opacity-70">Tu espacio de lectura en Telegram</p>
            </div>
            <div class="w-12"></div>
        </header>

        <!-- ÚNICO CONTENEDOR DE DATOS -->
        <div id="content-box" class="space-y-3">
            <div class="text-center py-10 opacity-65">Cargando...</div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const SUPABASE_URL = 'https://bteeppgksogbqozqvzxu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DOO_WWtFKHNPgMPmr1dfuA_xQ4BEniF';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentView = 'books'; // 'books', 'chapters', 'verses'
        let selectedBook = null;

        const contentBox = document.getElementById('content-box');
        const backBtn = document.getElementById('back-btn');
        const mainTitle = document.getElementById('main-title');
        const mainSubtitle = document.getElementById('main-subtitle');

        // 1. CARGAR LIBROS
        async function cargarLibros() {
            currentView = 'books';
            backBtn.classList.add('hidden');
            mainTitle.innerText = "📖 Biblia TMA";
            mainSubtitle.innerText = "Tu espacio de lectura en Telegram";
            mainSubtitle.style.display = 'block';
            
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando libros...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('bible_books')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                if (!data || data.length === 0) {
                    contentBox.innerHTML = '<p class="text-center opacity-60">No hay libros cargados.</p>';
                    return;
                }

                contentBox.innerHTML = data.map(book => `
                    <div onclick="seleccionarLibro('${book.id}', '${book.name}')" class="flex items-center justify-between p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 active:scale-98 transition cursor-pointer shadow-sm">
                        <div>
                            <span class="font-semibold text-base">${book.name}</span>
                            <span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-700 opacity-80">${book.testament}</span>
                        </div>
                        <span class="opacity-40 text-lg">›</span>
                    </div>
                `).join('');

            } catch (err) {
                contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar los libros.</p>';
                console.error(err);
            }
        }

        // 2. CARGAR CAPÍTULOS
        async function seleccionarLibro(bookId, bookName) {
            selectedBook = { id: bookId, name: bookName };
            currentView = 'chapters';
            
            backBtn.classList.remove('hidden');
            mainTitle.innerText = bookName;
            mainSubtitle.innerText = "Selecciona un capítulo";

            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando capítulos...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('bible_verses')
                    .select('chapter')
                    .eq('book_id', bookId);

                if (error) throw error;

                if (!data || data.length === 0) {
                    contentBox.innerHTML = '<p class="text-center opacity-60">No hay capítulos disponibles.</p>';
                    return;
                }

                const chapters = [...new Set(data.map(item => item.chapter))].sort((a, b) => a - b);

                contentBox.innerHTML = `
                    <div class="grid grid-cols-4 gap-2">
                        ${chapters.map(chNum => `
                            <div onclick="seleccionarCapitulo(${chNum})" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 text-center font-semibold active:scale-95 transition cursor-pointer shadow-sm">
                                ${chNum}
                            </div>
                        `).join('')}
                    </div>
                `;

            } catch (err) {
                contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar los capítulos.</p>';
                console.error(err);
            }
        }

        // 3. CARGAR VERSÍCULOS
        async function seleccionarCapitulo(chapterNumber) {
            currentView = 'verses';

            backBtn.classList.remove('hidden');
            mainTitle.innerText = `${selectedBook.name} - Cap. ${chapterNumber}`;
            mainSubtitle.style.display = 'none';

            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando versículos...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('bible_verses')
                    .select('*')
                    .eq('book_id', selectedBook.id)
                    .eq('chapter', chapterNumber)
                    .order('verse', { ascending: true });

                if (error) throw error;

                if (!data || data.length === 0) {
                    contentBox.innerHTML = '<p class="text-center opacity-60">No hay versículos en este capítulo.</p>';
                    return;
                }

                contentBox.innerHTML = data.map(v => `
                    <div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 leading-relaxed text-sm">
                        <span class="font-bold text-xs opacity-60 mr-1">${v.verse}</span> ${v.text}
                    </div>
                `).join('');

            } catch (err) {
                contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar los versículos.</p>';
                console.error(err);
            }
        }

        // BOTÓN VOLVER
        function volverAtras() {
            if (currentView === 'verses') {
                seleccionarLibro(selectedBook.id, selectedBook.name);
            } else if (currentView === 'chapters') {
                cargarLibros();
            }
        }

        // Iniciar
        cargarLibros();
    </script>
</body>
</html>
