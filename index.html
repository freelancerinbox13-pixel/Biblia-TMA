<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblia TMA</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen p-4 font-sans">

    <div class="max-w-md mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-bold">📖 Biblia TMA</h1>
            <p class="text-sm opacity-70">Tu espacio de lectura en Telegram</p>
        </header>

        <div id="loading" class="text-center py-10 opacity-60">Cargando libros...</div>
        <div id="books-container" class="space-y-3"></div>
    </div>

    <script>
        // Inicializar Telegram Mini App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Configuración de Supabase (reemplaza con tus credenciales)
        const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
        const SUPABASE_ANON_KEY = 'tu-anon-key';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarLibros() {
            const container = document.getElementById('books-container');
            const loading = document.getElementById('loading');

            try {
                const { data, error } = await supabase
                    .from('bible_books')
                    .select('*')
                    .order('book_order', { ascending: true });

                loading.style.display = 'none';

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center opacity-60">No hay libros cargados todavía.</p>';
                    return;
                }

                container.innerHTML = data.map(book => `
                    <div onclick="alert('Abriendo ${book.name}')" class="flex items-center justify-between p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 active:scale-98 transition cursor-pointer shadow-sm">
                        <div>
                            <span class="font-semibold text-base">${book.name}</span>
                            <span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-700 opacity-80">${book.testament}</span>
                        </div>
                        <span class="opacity-40 text-lg">›</span>
                    </div>
                `).join('');

            } catch (err) {
                loading.innerText = 'Error al cargar los datos.';
                console.error(err);
            }
        }

        cargarLibros();
    </script>
</body>
</html>
