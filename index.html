<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblia TMA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes burstStar {
            0% { transform: translate(0, 0) scale(0.2) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(720deg); opacity: 0; }
        }
        @keyframes fadeInOut {
            0% { transform: scale(0.6); opacity: 0; }
            15% { transform: scale(1.1); opacity: 1; }
            85% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0; }
        }
        .burst-particle { position: absolute; top: 50%; left: 50%; animation: burstStar 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; pointer-events: none; }
        .blessing-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.75); z-index: 100; pointer-events: none; animation: fadeInOut 3s ease-in-out forwards; }
    </style>
</head>
<body class="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen p-4 font-sans pb-20 relative overflow-x-hidden">

    <div id="explosion-overlay" class="hidden"></div>

    <div class="max-w-md mx-auto">
        <header class="mb-4 flex items-center justify-between">
            <button id="back-btn" onclick="volverAtras()" class="hidden px-3 py-1.5 rounded-lg bg-zinc-200 dark:bg-zinc-800 text-sm font-medium active:scale-95 transition">← Volver</button>
            <div class="text-center flex-1">
                <h1 id="main-title" class="text-2xl font-bold">📖 Biblia TMA</h1>
                <p id="main-subtitle" class="text-sm opacity-70">Tu espacio de lectura en Telegram</p>
            </div>
            <div class="w-12"></div>
        </header>

        <nav class="grid grid-cols-7 gap-1 mb-5 bg-zinc-100 dark:bg-zinc-800 p-1 rounded-xl text-center text-xs font-medium">
            <button onclick="cargarLibros()" class="py-2 rounded-lg bg-zinc-200 dark:bg-zinc-700 transition">📖 Biblia</button>
            <button onclick="cargarApocrifos()" class="py-2 rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">📜 Apócrifos</button>
            <button onclick="abrirBuscador()" class="py-2 rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">🔍 Buscar</button>
            <button onclick="cargarFavoritos()" class="py-2 rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">⭐ Favoritos</button>
            <button onclick="cargarPlanes()" class="py-2 rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">📅 Planes</button>
            <button onclick="cargarOraciones()" class="py-2 rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">🙏 Oración</button>
            <button onclick="cargarTrivia()" class="py-2 rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">❓ Trivia</button>
        </nav>

        <div id="content-box" class="space-y-3">
            <div class="text-center py-10 opacity-65">Cargando...</div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const SUPABASE_URL = 'https://bteeppgksogbqozqvzxu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DOO_WWtFKHNPgMPmr1dfuA_xQ4BEniF';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentView = 'books'; 
        let selectedBook = null;
        let selectedPlan = null;
        let allPlansCache = [];
        let isApocryphaMode = false;
        
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        let currentTelegramId = tgUser?.id || 123456789;
        let currentUserName = tgUser?.first_name || 'Usuario Demo';

        let userStats = JSON.parse(localStorage.getItem(`trivia_stats_${currentTelegramId}`)) || { stars: 145, chalices: 6 };

        function guardarStats() { localStorage.setItem(`trivia_stats_${currentTelegramId}`, JSON.stringify(userStats)); }

        async function registrarUsuario() {
            try {
                await supabaseClient.from('users').upsert([{ telegram_id: currentTelegramId, username: currentUserName, updated_at: new Date() }], { onConflict: 'telegram_id' });
            } catch (err) { console.error("Error al registrar usuario:", err); }
        }
        registrarUsuario();

        const contentBox = document.getElementById('content-box');
        const backBtn = document.getElementById('back-btn');
        const mainTitle = document.getElementById('main-title');
        const mainSubtitle = document.getElementById('main-subtitle');

        function parsearReferenciaBiblica(texto) {
            if (!texto) return null;
            const match = texto.match(/^([\w\sáéíóúÁÉÍÓÚñÑ]+?)\s+(\d+)(?::(\d+(?:-\d+)?))?/i);
            if (!match) return { libro: texto.trim(), capitulo: null, versiculo: null };
            return { libro: match[1].trim(), capitulo: parseInt(match[2]), versiculo: match[3] || null };
        }

        async function cargarLibros() {
            currentView = 'books'; isApocryphaMode = false; backBtn.classList.add('hidden');
            mainTitle.innerText = "📖 Biblia TMA"; mainSubtitle.innerText = "Tu espacio de lectura en Telegram"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando contenido...</div>';
            try {
                const dailyVerseHTML = await obtenerPalabraDelDiaHTML();
                const { data, error } = await supabaseClient.from('bible_books').select('*').order('id', { ascending: true });
                if (error) throw error;
                const librosHTML = data.map(book => `
                    <div onclick="seleccionarLibro('${book.id}', '${book.name}')" class="flex items-center justify-between p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 active:scale-98 transition cursor-pointer shadow-sm">
                        <div><span class="font-semibold text-base">${book.name}</span><span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-700 opacity-80">${book.testament || ''}</span></div>
                        <span class="opacity-40 text-lg">›</span>
                    </div>
                `).join('');
                contentBox.innerHTML = dailyVerseHTML + '<div class="space-y-2 mt-4">' + librosHTML + '</div>';
            } catch (err) { contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar la biblioteca.</p>'; }
        }

        async function cargarApocrifos() {
            currentView = 'apocrypha_list'; isApocryphaMode = true; backBtn.classList.add('hidden');
            mainTitle.innerText = "📜 Textos Apócrifos e Históricos"; mainSubtitle.innerText = "Evangelios y escritos antiguos"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando textos especiales...</div>';
            try {
                const { data, error } = await supabaseClient.from('apocrypha_books').select('*').order('id', { ascending: true });
                if (error) throw error;
                contentBox.innerHTML = '<div class="space-y-2">' + data.map(book => `
                    <div onclick="seleccionarLibro('${book.id}', '${book.name}')" class="flex items-center justify-between p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 active:scale-98 transition cursor-pointer shadow-sm">
                        <div><span class="font-semibold text-base">${book.name}</span><span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-600 dark:text-amber-400 font-medium">${book.testament || ''}</span><p class="text-xs opacity-70 mt-1">${book.description || ''}</p></div>
                        <span class="opacity-40 text-lg">›</span>
                    </div>
                `).join('') + '</div>';
            } catch (err) { contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar los textos apócrifos.</p>'; }
        }

        async function obtenerPalabraDelDiaHTML() {
            const todayStr = new Date().toISOString().split('T')[0];
            let dailyData = JSON.parse(localStorage.getItem('bible_daily_verse'));
            if (!dailyData || dailyData.date !== todayStr) {
                try {
                    const { data } = await supabaseClient.from('bible_verses').select('chapter, verse, text, bible_books(name, modern_name)').limit(100);
                    if (data && data.length > 0) {
                        const v = data[Math.floor(Math.random() * data.length)];
                        dailyData = { date: todayStr, book: v.bible_books?.modern_name || v.bible_books?.name || 'Escritura', chapter: v.chapter, verse: v.verse, text: v.text };
                        localStorage.setItem('bible_daily_verse', JSON.stringify(dailyData));
                    }
                } catch (e) {}
            }
            if (!dailyData) return '';
            return `
                <div class="p-4 rounded-2xl bg-gradient-to-br from-amber-500/15 via-amber-500/10 to-transparent border border-amber-500/40 shadow-md space-y-2 relative overflow-hidden">
                    <div class="flex items-center justify-between"><span class="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider">🌅 Palabra del Día</span></div>
                    <p class="text-sm italic opacity-90 font-serif leading-relaxed">"${dailyData.text}"</p>
                    <div class="flex justify-between items-center pt-1"><span class="text-xs font-extrabold text-amber-600 dark:text-amber-400">📖 ${dailyData.book} ${dailyData.chapter}:${dailyData.verse}</span></div>
                </div>
            `;
        }

        async function seleccionarLibro(bookId, bookName) {
            selectedBook = { id: bookId, name: bookName }; currentView = 'chapters'; backBtn.classList.remove('hidden');
            mainTitle.innerText = bookName; mainSubtitle.innerText = "Selecciona un capítulo";
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando capítulos...</div>';
            try {
                const tableName = isApocryphaMode ? 'apocrypha_verses' : 'bible_verses';
                const { data } = await supabaseClient.from(tableName).select('chapter').eq('book_id', bookId);
                const chapters = [...new Set(data.map(item => item.chapter))].sort((a, b) => a - b);
                contentBox.innerHTML = `<div class="grid grid-cols-4 gap-2">${chapters.map(chNum => `<div onclick="seleccionarCapitulo(${chNum})" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 text-center font-semibold active:scale-95 transition cursor-pointer shadow-sm">${chNum}</div>`).join('')}</div>`;
            } catch (err) { contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar capítulos.</p>'; }
        }

        async function seleccionarCapitulo(chapterNumber) {
            currentView = 'verses'; backBtn.classList.remove('hidden'); mainTitle.innerText = `${selectedBook.name} - Cap. ${chapterNumber}`; mainSubtitle.style.display = 'none';
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando versículos...</div>';
            try {
                const tableName = isApocryphaMode ? 'apocrypha_verses' : 'bible_verses';
                const { data } = await supabaseClient.from(tableName).select('*').eq('book_id', selectedBook.id).eq('chapter', chapterNumber).order('verse', { ascending: true });
                contentBox.innerHTML = data.map(v => `<div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 leading-relaxed text-sm flex justify-between items-start gap-2"><div><span class="font-bold text-xs opacity-60 mr-1">${v.verse}</span> ${v.text}</div></div>`).join('');
            } catch (err) { contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar versículos.</p>'; }
        }

        function cargarFavoritos() {
            currentView = 'favorites'; backBtn.classList.add('hidden'); mainTitle.innerText = "⭐ Mis Favoritos"; mainSubtitle.innerText = "Tus versículos guardados"; mainSubtitle.style.display = 'block';
            try {
                const favoritos = JSON.parse(localStorage.getItem('bible_favorites') || '[]');
                if (favoritos.length === 0) { contentBox.innerHTML = '<p class="text-center opacity-60 py-10">Aún no tienes versículos guardados.</p>'; return; }
                contentBox.innerHTML = favoritos.map((fav, index) => `<div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 text-sm space-y-1 shadow-sm border-l-4 border-amber-500"><div class="font-bold text-amber-600 dark:text-amber-400"><span>${fav.book} ${fav.chapter}:${fav.verse}</span></div><div class="opacity-90">"${fav.text}"</div></div>`).join('');
            } catch (err) {}
        }

        function abrirBuscador() {
            currentView = 'search'; backBtn.classList.add('hidden'); mainTitle.innerText = "🔍 Buscador Bíblico"; mainSubtitle.innerText = "Busca por libro, cita o palabras"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = `<div class="space-y-3"><div class="flex gap-2"><input type="text" id="searchInput" placeholder="Ej: Salmo 23..." class="flex-1 p-3 rounded-xl bg-zinc-100 dark:bg-zinc-800 border-none outline-none text-sm"><button onclick="ejecutarBusqueda()" class="px-4 py-3 bg-amber-600 text-white rounded-xl font-semibold text-sm">Buscar</button></div><div id="search-results" class="space-y-2 mt-4"><p class="text-center opacity-50 text-sm py-5">Escribe una cita o palabra clave</p></div></div>`;
        }

        async function ejecutarBusqueda() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('search-results');
            if (!rawQuery) return;
            resultsContainer.innerHTML = '<div class="text-center py-6 opacity-65">Buscando...</div>';
            try {
                const { data } = await supabaseClient.from('bible_verses').select('chapter, verse, text, bible_books(name, modern_name)').ilike('text', `%${rawQuery}%`).limit(30);
                if (!data || data.length === 0) { resultsContainer.innerHTML = `<p class="text-center opacity-60 py-5">No se encontraron resultados.</p>`; return; }
                resultsContainer.innerHTML = data.map(item => `<div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 text-sm shadow-sm"><div class="font-bold text-amber-600 dark:text-amber-400 mb-1">${item.bible_books?.modern_name || item.bible_books?.name} ${item.chapter}:${item.verse}</div><div class="opacity-90">"${item.text}"</div></div>`).join('');
            } catch (err) {}
        }

        async function cargarPlanes() {
            currentView = 'plans'; backBtn.classList.add('hidden'); mainTitle.innerText = "📅 Planes de Lectura"; mainSubtitle.innerText = "Devocionales"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = '<div id="plans-list" class="space-y-3"><div class="text-center py-6 opacity-65">Cargando planes...</div></div>';
            try {
                const { data } = await supabaseClient.from('reading_plans').select('*');
                allPlansCache = data || [];
                document.getElementById('plans-list').innerHTML = allPlansCache.map(plan => `<div class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 space-y-1 shadow-sm"><h3 class="font-bold text-base">${plan.title}</h3><p class="text-xs opacity-70">${plan.description || ''}</p></div>`).join('');
            } catch (err) {}
        }

        // --- SECCIÓN DE ORACIÓN, PETICIONES Y ROSARIO INTERACTIVO ---
        async function cargarOraciones() {
            currentView = 'prayer'; backBtn.classList.add('hidden'); mainTitle.innerText = "🙏 Oración y Rosario"; mainSubtitle.innerText = "Espacio devocional y guía espiritual"; mainSubtitle.style.display = 'block';

            contentBox.innerHTML = `
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div onclick="cargarMenuCategoriasOraciones()" class="p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-center cursor-pointer active:scale-98 transition shadow-sm">
                            <div class="text-2xl mb-1">📖</div><div class="font-bold text-sm text-amber-600 dark:text-amber-400">Oraciones</div><div class="text-[11px] opacity-70">Por categorías</div>
                        </div>
                        <div onclick="cargarRosarioGuiado()" class="p-4 rounded-xl bg-purple-500/10 border border-purple-500/30 text-center cursor-pointer active:scale-98 transition shadow-sm">
                            <div class="text-2xl mb-1">📿</div><div class="font-bold text-sm text-purple-600 dark:text-purple-400">Santo Rosario</div><div class="text-[11px] opacity-70">Rezo guiado diario</div>
                        </div>
                    </div>

                    <div class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 space-y-2 mt-4">
                        <h3 class="font-bold text-sm mb-1">💬 Peticiones de la Comunidad</h3>
                        <textarea id="prayerInput" placeholder="Escribe tu petición de oración..." class="w-full p-3 rounded-lg bg-white dark:bg-zinc-900 border-none outline-none text-sm resize-none h-20"></textarea>
                        <button onclick="enviarOracion()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-semibold text-sm transition">Compartir Petición</button>
                    </div>
                    <div id="prayer-list" class="space-y-2"><div class="text-center py-6 opacity-65">Cargando peticiones...</div></div>
                </div>
            `;
            obtenerListaOraciones();
        }

        async function cargarMenuCategoriasOraciones() {
            currentView = 'prayer_categories'; backBtn.classList.remove('hidden'); mainTitle.innerText = "📖 Categorías de Oración"; mainSubtitle.innerText = "Selecciona un propósito";
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando oraciones...</div>';
            try {
                const { data: categories } = await supabaseClient.from('prayer_categories').select('*').order('id');
                const { data: prayers } = await supabaseClient.from('prayers').select('*');
                contentBox.innerHTML = categories.map(cat => {
                    const prayersInCat = prayers.filter(p => p.category_id === cat.id);
                    return `
                        <div class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 space-y-2 shadow-sm">
                            <h3 class="font-bold text-base text-amber-600 dark:text-amber-400">${cat.name}</h3>
                            <div class="space-y-1 mt-2">
                                ${prayersInCat.map(p => `
                                    <div onclick="verDetalleOracion('${p.title.replace(/'/g, "\\'")}', '${p.content.replace(/'/g, "\\'").replace(/\n/g, '\\n')}', '${p.audio_url || ''}')" class="p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-semibold flex justify-between items-center cursor-pointer active:scale-98 transition">
                                        <span>${p.title}</span><span class="opacity-40">›</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {}
        }

        function verDetalleOracion(title, content, audioUrl) {
            currentView = 'prayer_detail'; backBtn.classList.remove('hidden'); mainTitle.innerText = title; mainSubtitle.style.display = 'none';
            const formattedContent = content.replace(/\\n/g, '<br>');
            const audioHTML = audioUrl ? `<div class="mt-4 p-3 bg-amber-500/10 rounded-xl border border-amber-500/30 text-center"><audio controls class="w-full"><source src="${audioUrl}" type="audio/mpeg">Tu navegador no soporta audio.</audio></div>` : '';
            contentBox.innerHTML = `<div class="p-5 rounded-2xl bg-zinc-50 dark:bg-zinc-800/60 shadow-sm space-y-4"><div class="text-sm leading-relaxed whitespace-pre-line opacity-95">${formattedContent}</div>${audioHTML}</div>`;
        }

        let rosarioActual = { tipo: '', misterioIndex: 0, pasoActual: 'padrenuestro', cuentaAveMarias: 10 };
        const listaMisteriosData = {
            'Gozosos': ["1. La encarnación del Hijo de Dios.", "2. La visitación de Nuestra Señora.", "3. El nacimiento del Hijo de Dios en Belén.", "4. La presentación del Niño Jesús.", "5. El Niño Jesús perdido y hallado."],
            'Luminosos': ["1. El bautismo de Jesús en el Jordán.", "2. Las bodas de Caná.", "3. El anuncio del Reino.", "4. La transfiguración.", "5. La institución de la Eucaristía."],
            'Dolorosos': ["1. La oración en el huerto.", "2. La flagelación.", "3. La coronación de espinas.", "4. Jesús con la cruz a cuestas.", "5. La crucifixión y muerte."],
            'Gloriosos': ["1. La resurrección.", "2. La ascensión.", "3. La venida del Espíritu Santo.", "4. La asunción de la Virgen.", "5. La coronación."]
        };

        const rosarioAudioUrls = {
            padrenuestro: "https://bteeppgksogbqozqvzxu.supabase.co/storage/v1/object/public/audios-oraciones/padre_nuestro.mp3",
            avemaria: "https://bteeppgksogbqozqvzxu.supabase.co/storage/v1/object/public/audios-oraciones/ave_maria.mp3",
            gloria: "https://bteeppgksogbqozqvzxu.supabase.co/storage/v1/object/public/audios-oraciones/gloria_al_padre.mp3"
        };

        function cargarRosarioGuiado() {
            currentView = 'rosary'; backBtn.classList.remove('hidden'); mainTitle.innerText = "📿 Santo Rosario"; mainSubtitle.innerText = "Meditación de los Misterios"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = `
                <div class="space-y-2">
                    <div onclick="mostrarMisterioRosario('Gozosos')" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 flex justify-between items-center cursor-pointer active:scale-98 transition"><div><span class="font-bold text-base">Misterios Gozosos</span><p class="text-xs opacity-70">Lunes y Sábado</p></div><span class="opacity-40 text-lg">›</span></div>
                    <div onclick="mostrarMisterioRosario('Luminosos')" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 flex justify-between items-center cursor-pointer active:scale-98 transition"><div><span class="font-bold text-base">Misterios Luminosos</span><p class="text-xs opacity-70">Jueves</p></div><span class="opacity-40 text-lg">›</span></div>
                    <div onclick="mostrarMisterioRosario('Dolorosos')" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 flex justify-between items-center cursor-pointer active:scale-98 transition"><div><span class="font-bold text-base">Misterios Dolorosos</span><p class="text-xs opacity-70">Martes y Viernes</p></div><span class="opacity-40 text-lg">›</span></div>
                    <div onclick="mostrarMisterioRosario('Gloriosos')" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 flex justify-between items-center cursor-pointer active:scale-98 transition"><div><span class="font-bold text-base">Misterios Gloriosos</span><p class="text-xs opacity-70">Miércoles y Domingo</p></div><span class="opacity-40 text-lg">›</span></div>
                </div>
            `;
        }

        function mostrarMisterioRosario(tipo) {
            currentView = 'rosary_detail'; backBtn.classList.remove('hidden'); mainTitle.innerText = `Misterios ${tipo}`; mainSubtitle.style.display = 'block'; mainSubtitle.innerText = "Selecciona una decena";
            const misterios = listaMisteriosData[tipo];
            contentBox.innerHTML = `<div class="space-y-3">${misterios.map((m, idx) => `<div onclick="iniciarRezoMisterio('${tipo}', ${idx})" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 flex justify-between items-center cursor-pointer active:scale-98 transition shadow-sm"><div><span class="font-bold text-purple-600 dark:text-purple-400 text-xs">Decena ${idx + 1}</span><p class="font-medium text-sm mt-0.5">${m}</p></div><span class="text-xs bg-purple-500/20 text-purple-600 dark:text-purple-400 px-2.5 py-1 rounded-lg font-semibold">Rezar ›</span></div>`).join('')}</div>`;
        }

        function iniciarRezoMisterio(tipo, index) {
            rosarioActual = { tipo: tipo, misterioIndex: index, pasoActual: 'padrenuestro', cuentaAveMarias: 10 };
            renderizarPantallaRezo();
        }

        function renderizarPantallaRezo() {
            const tipo = rosarioActual.tipo;
            const idx = rosarioActual.misterioIndex;
            const nombreMisterio = listaMisteriosData[tipo][idx];
            let contenidoPaso = '', botonAccion = '', audioPaso = '';

            if (rosarioActual.pasoActual === 'padrenuestro') {
                audioPaso = `<audio controls autoplay class="w-full mb-3"><source src="${rosarioAudioUrls.padrenuestro}" type="audio/mpeg">Tu navegador no soporta audio.</audio>`;
                contenidoPaso = `<div class="text-amber-500 font-bold text-xs uppercase tracking-wider mb-1">1. Padre Nuestro</div><p class="text-sm italic opacity-90 leading-relaxed font-serif">"Padre nuestro, que estás en el cielo, santificado sea tu Nombre..."</p>`;
                botonAccion = `<button onclick="avanzarPasoRosario('avemaria')" class="w-full py-3 bg-purple-600 text-white rounded-xl font-bold text-sm shadow-md">Siguiente: Ave Marías (10 restantes)</button>`;
            } else if (rosarioActual.pasoActual === 'avemaria') {
                audioPaso = `<audio controls autoplay class="w-full mb-3"><source src="${rosarioAudioUrls.avemaria}" type="audio/mpeg">Tu navegador no soporta audio.</audio>`;
                contenidoPaso = `<div class="flex justify-between items-center mb-2"><span class="text-purple-500 font-bold text-xs uppercase tracking-wider">Ave Marías</span><span class="text-lg font-extrabold bg-purple-500/20 text-purple-400 px-3 py-1 rounded-lg">Restantes: ${rosarioActual.cuentaAveMarias}</span></div><p class="text-sm italic opacity-90 leading-relaxed font-serif mb-4">"Dios te salve, María, llena eres de gracia..."</p>`;
                botonAccion = `<button onclick="restarAveMaria()" class="w-full py-3.5 bg-purple-600 text-white rounded-xl font-bold text-sm shadow-md">📿 Rezar Ave María (-1)</button>`;
            } else if (rosarioActual.pasoActual === 'gloria') {
                audioPaso = `<audio controls autoplay class="w-full mb-3"><source src="${rosarioAudioUrls.gloria}" type="audio/mpeg">Tu navegador no soporta audio.</audio>`;
                contenidoPaso = `<div class="text-blue-500 font-bold text-xs uppercase tracking-wider mb-1">Gloria y Jaculatoria</div><p class="text-sm italic opacity-90 leading-relaxed font-serif mb-2">"Gloria al Padre, y al Hijo, y al Espíritu Santo..."</p>`;
                botonAccion = `<button onclick="finalizarDecena()" class="w-full py-3 bg-green-600 text-white rounded-xl font-bold text-sm shadow-md">✓ Finalizar esta decena</button>`;
            }

            contentBox.innerHTML = `
                <div class="p-5 rounded-2xl bg-zinc-100 dark:bg-zinc-800 shadow-sm space-y-4">
                    <div class="flex justify-between items-center border-b border-zinc-200 dark:border-zinc-700 pb-3">
                        <div><span class="text-xs font-bold text-purple-500 uppercase">Misterios ${tipo}</span><h3 class="font-bold text-base mt-0.5">${nombreMisterio}</h3></div>
                        <button onclick="mostrarMisterioRosario('${tipo}')" class="text-xs px-2.5 py-1 bg-zinc-200 dark:bg-zinc-700 rounded-lg font-medium">Volver</button>
                    </div>
                    <div class="bg-white dark:bg-zinc-900 p-4 rounded-xl shadow-inner">
                        ${audioPaso}
                        ${contenidoPaso}
                    </div>
                    <div class="pt-2">${botonAccion}</div>
                </div>
            `;
        }

        function avanzarPasoRosario(nuevoPaso) { rosarioActual.pasoActual = nuevoPaso; renderizarPantallaRezo(); }
        function restarAveMaria() {
            if (rosarioActual.cuentaAveMarias > 1) { rosarioActual.cuentaAveMarias--; } 
            else { rosarioActual.cuentaAveMarias = 0; rosarioActual.pasoActual = 'gloria'; }
            renderizarPantallaRezo();
        }
        function finalizarDecena() { alert("🌟 ¡Decena completada con éxito!"); mostrarMisterioRosario(rosarioActual.tipo); }

        async function obtenerListaOraciones() {
            const listContainer = document.getElementById('prayer-list');
            try {
                const { data } = await supabaseClient.from('prayer_requests').select('*').order('created_at', { ascending: false }).limit(20);
                if (!data || data.length === 0) { listContainer.innerHTML = '<p class="text-center opacity-60 py-4">No hay peticiones aún.</p>'; return; }
                listContainer.innerHTML = data.map(p => `
                    <div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 text-sm flex justify-between items-start gap-2">
                        <p class="opacity-90 flex-1">${p.request_text}</p>
                        ${p.telegram_id == currentTelegramId ? `<button onclick="eliminarOracion(${p.id})" class="text-xs text-red-500 hover:underline shrink-0">Borrar</button>` : ''}
                    </div>
                `).join('');
            } catch (err) {}
        }

        async function enviarOracion() {
            const text = document.getElementById('prayerInput').value.trim();
            if (!text) return;
            try {
                await supabaseClient.from('prayer_requests').insert([{ telegram_id: currentTelegramId, request_text: text, is_public: true }]);
                document.getElementById('prayerInput').value = '';
                alert("🙏 Petición compartida.");
                obtenerListaOraciones();
            } catch (err) {}
        }

        async function eliminarOracion(id) {
            try {
                await supabaseClient.from('prayer_requests').delete().eq('id', id).eq('telegram_id', currentTelegramId);
                obtenerListaOraciones();
            } catch (err) {}
        }

        async function cargarTrivia() {
            currentView = 'trivia'; backBtn.classList.add('hidden'); mainTitle.innerText = "❓ Trivia Bíblica"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando trivia...</div>';
        }

        function volverAtras() {
            if (currentView === 'verses') seleccionarLibro(selectedBook.id, selectedBook.name);
            else if (currentView === 'chapters') isApocryphaMode ? cargarApocrifos() : cargarLibros();
            else if (currentView === 'prayer_categories' || currentView === 'rosary' || currentView === 'prayer_detail') cargarOraciones();
            else if (currentView === 'rosary_detail') cargarRosarioGuiado();
        }

        cargarLibros();
    </script>
</body>
</html>
