<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblia TMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://sad.adsgram.ai/js/sad.js" async></script>
    <style>
        @keyframes burstStar {
            0% { transform: translate(0, 0) scale(0.2) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(720deg); opacity: 0; }
        }
        @keyframes fadeInOut {
            0% { transform: scale(0.6); opacity: 0; }
            15% { transform: scale(1.1); opacity: 1; }
            85% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0; }
        }
        .burst-particle { position: absolute; top: 50%; left: 50%; animation: burstStar 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; pointer-events: none; }
    </style>
</head>
<body class="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen p-4 font-sans pb-20 relative overflow-x-hidden">

    <div id="explosion-overlay" class="fixed inset-0 pointer-events-none z-50 overflow-hidden hidden"></div>

    <div class="max-w-md mx-auto">
        <header class="mb-4 flex items-center justify-between relative">
            <button id="back-btn" onclick="volverAtras()" class="hidden px-3 py-2 rounded-xl bg-zinc-200 dark:bg-zinc-800 text-sm font-semibold active:scale-95 transition">← Volver</button>
            <div class="text-center flex-1">
                <h1 id="main-title" class="text-2xl font-bold">📖 Biblia TMA</h1>
                <p id="main-subtitle" class="text-sm opacity-70">Tu espacio de lectura en Telegram</p>
            </div>
            <button onclick="toggleMenuDesplegable()" class="p-2.5 rounded-xl bg-amber-600 text-white font-bold text-lg shadow-md active:scale-95 transition flex items-center gap-1.5">
                <span>☰</span>
                <span class="text-xs pr-1 hidden sm:inline">Menú</span>
            </button>
        </header>

        <!-- MENÚ DESPLEGABLE -->
        <div id="dropdown-menu" class="hidden mb-6 p-4 rounded-2xl bg-zinc-100 dark:bg-zinc-800 shadow-xl border border-amber-500/30 space-y-2 transition-all duration-300">
            <div class="flex justify-between items-center pb-2 border-b border-zinc-200 dark:border-zinc-700">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">Menú Principal</span>
                <button onclick="toggleMenuDesplegable()" class="text-xs opacity-60 hover:opacity-100 font-bold px-2 py-1">✕ Cerrar</button>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="seleccionarOpcionMenu(cargarLibros)" class="p-3 rounded-xl bg-white dark:bg-zinc-900 text-left font-semibold text-sm flex items-center gap-2 active:scale-98 transition shadow-sm"><span class="text-lg">📖</span> Biblia</button>
                <button onclick="seleccionarOpcionMenu(cargarApocrifos)" class="p-3 rounded-xl bg-white dark:bg-zinc-900 text-left font-semibold text-sm flex items-center gap-2 active:scale-98 transition shadow-sm"><span class="text-lg">📜</span> Apócrifos</button>
                <button onclick="seleccionarOpcionMenu(abrirBuscador)" class="p-3 rounded-xl bg-white dark:bg-zinc-900 text-left font-semibold text-sm flex items-center gap-2 active:scale-98 transition shadow-sm"><span class="text-lg">🔍</span> Buscar</button>
                <button onclick="seleccionarOpcionMenu(cargarFavoritos)" class="p-3 rounded-xl bg-white dark:bg-zinc-900 text-left font-semibold text-sm flex items-center gap-2 active:scale-98 transition shadow-sm"><span class="text-lg">⭐</span> Favoritos</button>
                <button onclick="seleccionarOpcionMenu(cargarPlanes)" class="p-3 rounded-xl bg-white dark:bg-zinc-900 text-left font-semibold text-sm flex items-center gap-2 active:scale-98 transition shadow-sm"><span class="text-lg">📅</span> Planes</button>
                <button onclick="seleccionarOpcionMenu(cargarOraciones)" class="p-3 rounded-xl bg-white dark:bg-zinc-900 text-left font-semibold text-sm flex items-center gap-2 active:scale-98 transition shadow-sm"><span class="text-lg">🙏</span> Oración</button>
                <button onclick="seleccionarOpcionMenu(cargarEstampitas)" class="p-3 rounded-xl bg-white dark:bg-zinc-900 text-left font-semibold text-sm flex items-center gap-2 active:scale-98 transition shadow-sm"><span class="text-lg">🖼️</span> Estampas</button>
                <button onclick="seleccionarOpcionMenu(cargarTrivia)" class="p-3 rounded-xl bg-white dark:bg-zinc-900 text-left font-semibold text-sm flex items-center gap-2 active:scale-98 transition shadow-sm"><span class="text-lg">❓</span> Trivia</button>
            </div>
        </div>

        <div id="content-box" class="space-y-3">
            <div class="text-center py-10 opacity-65">Cargando...</div>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const SUPABASE_URL = 'https://bteeppgksogbqozqvzxu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DOO_WWtFKHNPgMPmr1dfuA_xQ4BEniF';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentView = 'books'; 
        let selectedBook = null;
        let selectedCategory = null;
        let selectedStampName = null;
        let isApocryphaMode = false;
        let rosarioTipoSeleccionado = '';
        
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        let currentTelegramId = tgUser?.id || 123456789;
        let currentUserName = tgUser?.first_name || 'Usuario Demo';

        let userStats = JSON.parse(localStorage.getItem(`trivia_stats_${currentTelegramId}`)) || { stars: 145, chalices: 6 };
        function guardarStats() { localStorage.setItem(`trivia_stats_${currentTelegramId}`, JSON.stringify(userStats)); }

        const contentBox = document.getElementById('content-box');
        const backBtn = document.getElementById('back-btn');
        const mainTitle = document.getElementById('main-title');
        const mainSubtitle = document.getElementById('main-subtitle');
        const dropdownMenu = document.getElementById('dropdown-menu');

        function toggleMenuDesplegable() { dropdownMenu.classList.toggle('hidden'); }
        function seleccionarOpcionMenu(funcionCarga) { dropdownMenu.classList.add('hidden'); funcionCarga(); }

        function dispararExplosionEstrellas() {
            const overlay = document.getElementById('explosion-overlay');
            if (!overlay) return;
            overlay.innerHTML = '';
            overlay.classList.remove('hidden');
            for (let i = 0; i < 22; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle text-amber-400 text-xl font-bold';
                particle.innerHTML = '⭐';
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 140;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                particle.style.setProperty('--scale', 0.8 + Math.random() * 1.2);
                overlay.appendChild(particle);
            }
            setTimeout(() => { overlay.innerHTML = ''; overlay.classList.add('hidden'); }, 1800);
        }

        async function cargarLibros() {
            currentView = 'books'; isApocryphaMode = false; backBtn.classList.add('hidden');
            mainTitle.innerText = "📖 Biblia TMA"; mainSubtitle.innerText = "Tu espacio de lectura en Telegram"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando contenido...</div>';
            try {
                const { data, error } = await supabaseClient.from('bible_books').select('*').order('id', { ascending: true });
                if (error) throw error;
                const librosHTML = data.map(book => `
                    <div onclick="seleccionarLibro('${book.id}', '${book.name}')" class="flex items-center justify-between p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 active:scale-98 transition cursor-pointer shadow-sm">
                        <div><span class="font-semibold text-base">${book.name}</span><span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-700 opacity-80">${book.testament || ''}</span></div>
                        <span class="opacity-40 text-lg">›</span>
                    </div>
                `).join('');
                contentBox.innerHTML = '<div class="space-y-2 mt-2">' + librosHTML + '</div>';
            } catch (err) { contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar la biblioteca.</p>'; }
        }

        async function cargarApocrifos() {
            currentView = 'apocrypha_list'; isApocryphaMode = true; backBtn.classList.add('hidden');
            mainTitle.innerText = "📜 Textos Apócrifos"; mainSubtitle.innerText = "Evangelios y escritos antiguos"; mainSubtitle.style.display = 'block';
            try {
                const { data, error } = await supabaseClient.from('apocrypha_books').select('*').order('id', { ascending: true });
                if (error) throw error;
                contentBox.innerHTML = '<div class="space-y-2">' + data.map(book => `
                    <div onclick="seleccionarLibro('${book.id}', '${book.name}')" class="flex items-center justify-between p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 active:scale-98 transition cursor-pointer shadow-sm">
                        <div><span class="font-semibold text-base">${book.name}</span><span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-600 dark:text-amber-400 font-medium">${book.testament || ''}</span></div>
                        <span class="opacity-40 text-lg">›</span>
                    </div>
                `).join('') + '</div>';
            } catch (err) { contentBox.innerHTML = '<p class="text-center text-red-500">Error al cargar apócrifos.</p>'; }
        }

        async function seleccionarLibro(bookId, bookName) {
            selectedBook = { id: bookId, name: bookName }; currentView = 'chapters'; backBtn.classList.remove('hidden');
            mainTitle.innerText = bookName; mainSubtitle.innerText = "Selecciona un capítulo";
            try {
                const tableName = isApocryphaMode ? 'apocrypha_verses' : 'bible_verses';
                const { data } = await supabaseClient.from(tableName).select('chapter').eq('book_id', bookId);
                const chapters = [...new Set(data.map(item => item.chapter))].sort((a, b) => a - b);
                contentBox.innerHTML = `<div class="grid grid-cols-4 gap-2">${chapters.map(chNum => `<div onclick="seleccionarCapitulo(${chNum})" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 text-center font-semibold active:scale-95 transition cursor-pointer shadow-sm">${chNum}</div>`).join('')}</div>`;
            } catch (err) {}
        }

        async function seleccionarCapitulo(chapterNumber) {
            currentView = 'verses'; backBtn.classList.remove('hidden'); mainTitle.innerText = `${selectedBook.name} - Cap. ${chapterNumber}`; mainSubtitle.style.display = 'none';
            try {
                const tableName = isApocryphaMode ? 'apocrypha_verses' : 'bible_verses';
                const { data } = await supabaseClient.from(tableName).select('*').eq('book_id', selectedBook.id).eq('chapter', chapterNumber).order('verse', { ascending: true });
                contentBox.innerHTML = data.map(v => `<div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 leading-relaxed text-sm"><span class="font-bold text-xs opacity-60 mr-1">${v.verse}</span> ${v.text}</div>`).join('');
            } catch (err) {}
        }

        function cargarFavoritos() {
            currentView = 'favorites'; backBtn.classList.add('hidden'); mainTitle.innerText = "⭐ Mis Favoritos"; mainSubtitle.innerText = "Tus versículos guardados"; mainSubtitle.style.display = 'block';
            try {
                const favoritos = JSON.parse(localStorage.getItem('bible_favorites') || '[]');
                if (favoritos.length === 0) { contentBox.innerHTML = '<p class="text-center opacity-60 py-10">Aún no tienes versículos guardados.</p>'; return; }
                contentBox.innerHTML = favoritos.map(fav => `<div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 text-sm space-y-1 border-l-4 border-amber-500"><div class="font-bold text-amber-600">${fav.book} ${fav.chapter}:${fav.verse}</div><div>"${fav.text}"</div></div>`).join('');
            } catch (err) {}
        }

        function abrirBuscador() {
            currentView = 'search'; backBtn.classList.add('hidden'); mainTitle.innerText = "🔍 Buscador Bíblico"; mainSubtitle.innerText = "Busca por palabra"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = `<div class="space-y-3"><div class="flex gap-2"><input type="text" id="searchInput" placeholder="Ej: Amor..." class="flex-1 p-3 rounded-xl bg-zinc-100 dark:bg-zinc-800 outline-none text-sm"><button onclick="ejecutarBusqueda()" class="px-4 py-3 bg-amber-600 text-white rounded-xl font-semibold text-sm">Buscar</button></div><div id="search-results" class="space-y-2 mt-4"><p class="text-center opacity-50 text-sm py-5">Escribe una palabra clave</p></div></div>`;
        }

        async function ejecutarBusqueda() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('search-results');
            if (!rawQuery) return;
            try {
                const { data } = await supabaseClient.from('bible_verses').select('chapter, verse, text, bible_books(name, modern_name)').ilike('text', `%${rawQuery}%`).limit(30);
                if (!data || data.length === 0) { resultsContainer.innerHTML = `<p class="text-center opacity-60 py-5">No se encontraron resultados.</p>`; return; }
                resultsContainer.innerHTML = data.map(item => `<div class="p-3 rounded-lg bg-zinc-50 dark:bg-zinc-800/50 text-sm"><div class="font-bold text-amber-600 mb-1">${item.bible_books?.modern_name || item.bible_books?.name} ${item.chapter}:${item.verse}</div><div>"${item.text}"</div></div>`).join('');
            } catch (err) {}
        }

        async function cargarPlanes() {
            currentView = 'plans'; backBtn.classList.add('hidden'); mainTitle.innerText = "📅 Planes de Lectura"; mainSubtitle.innerText = "Devocionales"; mainSubtitle.style.display = 'block';
            try {
                const { data } = await supabaseClient.from('reading_plans').select('*');
                contentBox.innerHTML = (data || []).map(plan => `<div class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 space-y-1"><h3 class="font-bold text-base">${plan.title}</h3><p class="text-xs opacity-70">${plan.description || ''}</p></div>`).join('');
            } catch (err) {}
        }

        // --- ORACIÓN Y ROSARIO ---
        async function cargarOraciones() {
            currentView = 'prayer'; backBtn.classList.add('hidden'); mainTitle.innerText = "🙏 Oración y Rosario"; mainSubtitle.innerText = "Espacio devocional"; mainSubtitle.style.display = 'block';
            contentBox.innerHTML = `
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div onclick="cargarMenuCategoriasOraciones()" class="p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-center cursor-pointer active:scale-98 transition"><div class="text-2xl mb-1">📖</div><div class="font-bold text-sm text-amber-600">Oraciones</div></div>
                        <div onclick="cargarRosarioGuiado()" class="p-4 rounded-xl bg-purple-500/10 border border-purple-500/30 text-center cursor-pointer active:scale-98 transition"><div class="text-2xl mb-1">📿</div><div class="font-bold text-sm text-purple-600">Santo Rosario</div></div>
                    </div>
                </div>
            `;
        }

        // --- SECCIÓN DE ESTAMPAS POR CATEGORÍAS Y NOMBRES ---
        async function cargarEstampitas() {
            currentView = 'estampitas_categories';
            backBtn.classList.add('hidden');
            mainTitle.innerText = "🖼️ Estampitas y Santos";
            mainSubtitle.innerText = "Selecciona una categoría";
            mainSubtitle.style.display = 'block';

            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando categorías...</div>';
            try {
                const { data: categorias, error } = await supabaseClient.from('saint_categories').select('*').order('id');
                if (error || !categorias) throw error;
                contentBox.innerHTML = `
                    <div class="space-y-2">
                        ${categorias.map(cat => `
                            <div onclick="cargarNombresEstampas(${cat.id}, '${cat.name.replace(/'/g, "\\'")}')" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 flex justify-between items-center cursor-pointer active:scale-98 transition shadow-sm">
                                <span class="font-bold text-base text-amber-600 dark:text-amber-400">${cat.name}</span>
                                <span class="opacity-40 text-lg">›</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                contentBox.innerHTML = `<p class="text-center text-red-500">Error al cargar categorías de estampas.</p>`;
            }
        }

        async function cargarNombresEstampas(catId, catName) {
            selectedCategory = { id: catId, name: catName };
            currentView = 'estampitas_names';
            backBtn.classList.remove('hidden');
            mainTitle.innerText = catName;
            mainSubtitle.innerText = "Selecciona una estampa";

            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando estampas...</div>';
            try {
                const { data: estampas, error } = await supabaseClient.from('saint_stamps').select('name').eq('category_id', catId);
                if (error || !estampas) throw error;
                // Obtener nombres únicos de estampas
                const nombresUnicos = [...new Set(estampas.map(e => e.name))];
                
                contentBox.innerHTML = `
                    <div class="space-y-2">
                        ${nombresUnicos.map(nombre => `
                            <div onclick="cargarFotosEstampa('${nombre.replace(/'/g, "\\'")}')" class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 flex justify-between items-center cursor-pointer active:scale-98 transition shadow-sm">
                                <span class="font-semibold text-base">${nombre}</span>
                                <span class="opacity-40 text-lg">›</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                contentBox.innerHTML = `<p class="text-center text-red-500">Error al cargar nombres de estampas.</p>`;
            }
        }

        async function cargarFotosEstampa(nombreEstampa) {
            selectedStampName = nombreEstampa;
            currentView = 'estampitas_photos';
            backBtn.classList.remove('hidden');
            mainTitle.innerText = nombreEstampa;
            mainSubtitle.innerText = "Elige una foto para ver y descargar";

            contentBox.innerHTML = '<div class="text-center py-10 opacity-65">Cargando imágenes...</div>';
            try {
                const { data: fotos, error } = await supabaseClient.from('saint_stamps').select('*').eq('name', nombreEstampa);
                if (error || !fotos) throw error;

                contentBox.innerHTML = `
                    <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            ${fotos.map(est => `
                                <div class="p-3 rounded-2xl bg-zinc-100 dark:bg-zinc-800 space-y-2 shadow-sm flex flex-col justify-between">
                                    <div>
                                        <img src="${est.image_url}" class="w-full h-36 object-cover rounded-xl mb-2">
                                        <p class="text-[11px] italic opacity-80 mt-1">"${est.quote || 'El Señor es mi pastor.'}"</p>
                                    </div>
                                    <button onclick="desbloquearEstampita('${est.image_url}')" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold text-xs transition shadow">
                                        🎁 Ver Anuncio y Descargar
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (err) {
                contentBox.innerHTML = `<p class="text-center text-red-500">Error al cargar las imágenes.</p>`;
            }
        }

        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" }) : null;

        function desbloquearEstampita(imageUrl) {
            if (adController) {
                adController.show()
                    .then(() => {
                        dispararExplosionEstrellas();
                        alert("🎉 ¡Anuncio completado con éxito! Abriendo estampita...");
                        window.open(imageUrl, '_blank');
                    })
                    .catch(() => { alert("ℹ️ Debes ver el anuncio completo para desbloquear la descarga."); });
            } else {
                dispararExplosionEstrellas();
                alert("🎁 [Modo Demo] Anuncio simulado con éxito. Descargando estampita...");
                window.open(imageUrl, '_blank');
            }
        }

        // --- TRIVIA BÍBLICA ---
        function mostrarAnuncioRecompensado() {
            if (adController) {
                adController.show()
                    .then(() => {
                        userStats.stars += 10; guardarStats();
                        dispararExplosionEstrellas();
                        document.getElementById('global-stars-display').innerText = userStats.stars;
                        alert("🎉 ¡Ganaste +10 Estrellas ⭐!");
                    })
                    .catch(() => { alert("ℹ️ Debes ver el anuncio completo."); });
            } else {
                userStats.stars += 10; guardarStats();
                dispararExplosionEstrellas();
                if(document.getElementById('global-stars-display')) document.getElementById('global-stars-display').innerText = userStats.stars;
                alert("🎁 [Modo Demo] +10 Estrellas ⭐ añadidas.");
            }
        }

        function cargarTrivia() {
            currentView = 'trivia'; backBtn.classList.add('hidden'); 
            mainTitle.innerText = "❓ Trivia Bíblica"; mainSubtitle.style.display = 'block';
            mainSubtitle.innerText = "Pon a prueba tus conocimientos";
            
            contentBox.innerHTML = `
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <div class="flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl shadow-sm">
                        <span class="text-3xl">⭐</span>
                        <div><div class="text-[10px] font-bold opacity-70 uppercase">Estrellas</div><div id="global-stars-display" class="text-base font-extrabold text-amber-500">${userStats.stars}</div></div>
                    </div>
                    <div class="flex items-center gap-2 bg-purple-500/10 border border-purple-500/30 p-3 rounded-xl shadow-sm">
                        <span class="text-3xl">🍷</span>
                        <div><div class="text-[10px] font-bold opacity-70 uppercase">Cálices</div><div id="global-chalices-display" class="text-base font-extrabold text-purple-500">${userStats.chalices}</div></div>
                    </div>
                </div>

                <button onclick="mostrarAnuncioRecompensado()" class="w-full mb-4 py-3 px-4 bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-xl font-bold text-sm active:scale-98 transition flex items-center justify-between shadow-md">
                    <span class="flex items-center gap-2">🎁 Ver anuncio y ganar estrellas</span>
                    <span class="bg-amber-700/60 px-3 py-1 rounded-lg text-xs">+10 ⭐</span>
                </button>

                <div id="trivia-intro" class="text-center py-8 space-y-4 bg-zinc-100 dark:bg-zinc-800 p-6 rounded-2xl shadow-sm">
                    <h3 class="text-lg font-bold">¡Desafía tus conocimientos!</h3>
                    <p class="text-xs opacity-70">Responde correctamente a 5 preguntas aleatorias.</p>
                    <button onclick="iniciarPartidaTrivia()" class="w-full py-3.5 bg-amber-600 text-white rounded-xl font-bold text-sm shadow-md transition active:scale-98">
                        🚀 Iniciar Partida de Trivia
                    </button>
                </div>
                <div id="trivia-container" class="space-y-3 mt-4"></div>
            `;
        }

        let partidaActual = { preguntas: [], respondidas: 0, aciertos: 0 };

        async function iniciarPartidaTrivia() {
            const container = document.getElementById('trivia-container');
            document.getElementById('trivia-intro').style.display = 'none';
            container.innerHTML = '<div class="text-center py-6 opacity-65">Cargando 5 preguntas aleatorias...</div>';
            try {
                const { data } = await supabaseClient.from('trivia_questions').select('*');
                if (!data || data.length === 0) { container.innerHTML = `<div class="p-4 rounded-xl bg-zinc-100 text-center text-sm">No hay preguntas de trivia.</div>`; return; }
                partidaActual = { preguntas: data.sort(() => 0.5 - Math.random()).slice(0, 5), respondidas: 0, aciertos: 0 };
                renderizarPreguntasTrivia();
            } catch (err) {}
        }

        function renderizarPreguntasTrivia() {
            document.getElementById('trivia-container').innerHTML = partidaActual.preguntas.map((q, index) => `
                <div class="p-4 rounded-xl bg-zinc-100 dark:bg-zinc-800 space-y-3 shadow-sm question-card" data-correct="${(q.correct_option || 'A').toUpperCase().trim()}">
                    <div class="text-xs font-bold text-amber-500 uppercase">Pregunta ${index + 1} de 5</div>
                    <p class="font-semibold text-sm">${q.question_text || q.question}</p>
                    <div class="space-y-2 pt-1 options-group">
                        <div onclick="verificarRespuestaTrivia(this, 'A', ${q.points || 5})" data-option="A" class="option-btn p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-medium cursor-pointer">A) ${q.option_a}</div>
                        <div onclick="verificarRespuestaTrivia(this, 'B', ${q.points || 5})" data-option="B" class="option-btn p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-medium cursor-pointer">B) ${q.option_b}</div>
                        ${q.option_c ? `<div onclick="verificarRespuestaTrivia(this, 'C', ${q.points || 5})" data-option="C" class="option-btn p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-medium cursor-pointer">C) ${q.option_c}</div>` : ''}
                        ${q.option_d ? `<div onclick="verificarRespuestaTrivia(this, 'D', ${q.points || 5})" data-option="D" class="option-btn p-2.5 rounded-lg bg-white dark:bg-zinc-900 text-xs font-medium cursor-pointer">D) ${q.option_d}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function verificarRespuestaTrivia(elemento, opcionSeleccionada, puntos) {
            const card = elemento.closest('.question-card');
            if (card.classList.contains('answered')) return;
            card.classList.add('answered');
            partidaActual.respondidas++;
            const opcionCorrecta = card.getAttribute('data-correct');
            const opciones = card.querySelectorAll('.option-btn');
            opciones.forEach(opt => opt.style.pointerEvents = 'none');

            if (opcionSeleccionada === opcionCorrecta) {
                elemento.classList.add('bg-green-500/20', 'border', 'border-green-500', 'text-green-600');
                userStats.stars += puntos; guardarStats();
                document.getElementById('global-stars-display').innerText = userStats.stars;
                partidaActual.aciertos++;
            } else {
                elemento.classList.add('bg-red-500/20', 'border', 'border-red-500', 'text-red-600');
                opciones.forEach(opt => { if (opt.getAttribute('data-option') === opcionCorrecta) opt.classList.add('bg-green-500/20', 'border', 'border-green-500', 'text-green-600', 'font-bold'); });
            }

            if (partidaActual.respondidas === partidaActual.preguntas.length) {
                setTimeout(() => {
                    if (partidaActual.aciertos >= 4) dispararExplosionEstrellas();
                    alert(`🏁 ¡Partida finalizada! Acertaste ${partidaActual.aciertos} de 5.`);
                    cargarTrivia();
                }, 800);
            }
        }

        // --- BOTÓN VOLVER INTELIGENTE ---
        function volverAtras() {
            if (currentView === 'verses') seleccionarLibro(selectedBook.id, selectedBook.name);
            else if (currentView === 'chapters') isApocryphaMode ? cargarApocrifos() : cargarLibros();
            else if (currentView === 'estampitas_names') cargarEstampitas();
            else if (currentView === 'estampitas_photos') cargarNombresEstampas(selectedCategory.id, selectedCategory.name);
        }

        cargarLibros();
    </script>
</body>
</html>
